<style>
  
</style>

<main>
  <div>
    <h1>{{ title() }}</h1>
    <h2>Turno de: {{ turn === 1 ? player1.name : player2.name }}</h2>
  </div>
  <section>
    
    <div class="PlayerData">
      <p class="PlayerName">{{ player1.name }}</p>
      <div class="healthSection">
        <div class="healthBar" [style.width.%]="player1.health"></div>
      </div>
      <img src="assets/images/dracula.png" alt="dracula"/>
      <button class="attackButton" (click)="attack(1)" [disabled]="turn !== 1">Atacar</button>
      <button class="defendButton" (click)="defend(1)" [disabled]="turn !== 1">Defender</button>
    </div>

    <div class="PlayerData">
      <p class="PlayerName">{{ player2.name }}</p>
      <div class="healthSection">
        <div class="healthBar" [style.width.%]="player2.health"></div>
      </div>
      <img src="assets/images/frankenstein.png" alt="frankenstein"/>
      <button class="attackButton" (click)="attack(2)" [disabled]="turn !== 2">Atacar</button>
      <button class="defendButton" (click)="defend(2)" [disabled]="turn !== 2">Defender</button>
    </div>
  </section>
</main>
